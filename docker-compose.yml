services:

  chat-nginx:
    image: nginx:alpine
    container_name: chat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-app-1
      - chat-app-2
      - chat-app-3
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chat-network


  chat-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-app-1
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://chat-mongodb:27017/whatsapp
    depends_on:
      chat-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - chat-network


  chat-app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-app-2
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://chat-mongodb:27017/whatsapp
    depends_on:
      chat-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - chat-network


  chat-app-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-app-3
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://chat-mongodb:27017/whatsapp
    depends_on:
      chat-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - chat-network


  chat-mongodb:
    image: mongo:7.0-jammy
    container_name: chat-mongodb
    restart: unless-stopped
    volumes:
      - chat-mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - chat-network


volumes:
  chat-mongodb-data:


networks:
  chat-network:
    driver: bridge
